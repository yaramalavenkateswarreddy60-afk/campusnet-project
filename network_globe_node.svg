<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <g stroke="url(#cyber-grad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)">
    <!-- 8 Radial Spokes and Satellite Nodes -->
    <!-- Top (270°) -->
    <line x1="100" y1="52" x2="100" y2="26" />
    <circle cx="100" cy="20" r="6" fill="#0B0F19" stroke-width="4" />

    <!-- Top-Right (315°) -->
    <line x1="134" y1="66" x2="154" y2="46" />
    <circle cx="158" cy="42" r="6" fill="#0B0F19" stroke-width="4" />

    <!-- Right (0°) -->
    <line x1="148" y1="100" x2="174" y2="100" />
    <circle cx="180" cy="100" r="6" fill="#0B0F19" stroke-width="4" />

    <!-- Bottom-Right (45°) -->
    <line x1="134" y1="134" x2="154" y2="154" />
    <circle cx="158" cy="158" r="6" fill="#0B0F19" stroke-width="4" />

    <!-- Bottom (90°) -->
    <line x1="100" y1="148" x2="100" y2="174" />
    <circle cx="100" cy="180" r="6" fill="#0B0F19" stroke-width="4" />

    <!-- Bottom-Left (135°) -->
    <line x1="66" y1="134" x2="46" y2="154" />
    <circle cx="42" cy="158" r="6" fill="#0B0F19" stroke-width="4" />

    <!-- Left (180°) -->
    <line x1="52" y1="100" x2="26" y2="100" />
    <circle cx="20" cy="100" r="6" fill="#0B0F19" stroke-width="4" />

    <!-- Top-Left (225°) -->
    <line x1="66" y1="66" x2="46" y2="46" />
    <circle cx="42" cy="42" r="6" fill="#0B0F19" stroke-width="4" />

    <!-- Outer Concentric Ring -->
    <circle cx="100" cy="100" r="48" stroke-width="4.5" />

    <!-- Inner Globe Circle -->
    <circle cx="100" cy="100" r="35" stroke-width="4" fill="#0B0F19" fill-opacity="0.8" />

    <!-- Globe Grid: Latitudes -->
    <line x1="65" y1="100" x2="135" y2="100" stroke-width="3" />
    <path d="M 72 82 Q 100 90 128 82" stroke-width="3" />
    <path d="M 72 118 Q 100 110 128 118" stroke-width="3" />

    <!-- Globe Grid: Longitudes -->
    <line x1="100" y1="65" x2="100" y2="135" stroke-width="3" />
    <ellipse cx="100" cy="100" rx="18" ry="35" stroke-width="3" />
  </g>
</svg>
